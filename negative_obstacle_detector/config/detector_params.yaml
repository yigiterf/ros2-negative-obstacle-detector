# Parameters for the negative-obstacle detector node.
#
# The pipeline transforms the input cloud to `target_frame` (a gravity-aligned
# frame), preprocesses it, estimates the ground plane with RANSAC, and extracts
# negative and elevated obstacles.

negative_obstacle_detector:
  ros__parameters:
    input_topic: "/depth_camera/points"
    target_frame: "base_link"

    output_topic: "/negative_obstacle/preprocessed"
    ground_topic: "/negative_obstacle/ground"
    negative_topic: "/negative_obstacle/negative"
    elevated_topic: "/negative_obstacle/elevated"
    hazards_topic: "/negative_obstacle/hazards"
    markers_topic: "/negative_obstacle/markers"

    preprocessor:
      min_range: 0.4
      max_range: 6.0
      min_height: -0.6
      max_height: 1.2
      half_width: 3.0
      voxel_leaf_size: 0.02

    ground:
      distance_threshold: 0.03
      angle_tolerance: 0.26
      max_iterations: 200

    negative_obstacle:
      min_depth: 0.05
      overhang_min_height: 0.05
      overhang_max_height: 1.20
      cluster_tolerance: 0.05
      min_cluster_size: 8

    free_space:
      angle_bin_size: 1.0
      gap_threshold: 0.3
      min_range: 0.4
      max_range: 6.0
      sensor_x: 0.25
      sensor_y: 0.0
      sensor_z: 0.30
